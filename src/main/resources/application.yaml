spring:
  application:
    name: CreatorStore

  # Defaults to H2 for local dev/testing, but can be overridden by Docker/Environment variables
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:creatorstore}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: smtp.mailtrap.io
    port: 587
    username: your_mailtrap_user # REPLACE THIS with your actual Mailtrap username
    password: your_mailtrap_pass # REPLACE THIS with your actual Mailtrap password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456}
  expiration: ${JWT_EXPIRATION:86400000}

# Admin user initialization
admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@creatorstore.com}
  password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8080

logging:
  level:
    root: INFO
    in.anurag.CreatorStore: INFO
