spring:
  application:
    name: CreatorStore

  # --- OPTION A: H2 In-Memory Database (Recommended for immediate testing) ---
  datasource:
    url: jdbc:h2:mem:creatorstore
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # --- OPTION B: PostgreSQL (Uncomment and use .env file for this) ---
  # datasource:
  #   url: ${DATABASE_URL}
  #   username: ${DATABASE_USERNAME}
  #   password: ${DATABASE_PASSWORD}
  #   driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect # Change to PostgreSQLDialect if using Postgres

  h2:
    console:
      enabled: true
      path: /h2-console
