spring:
  application:
    name: CreatorStore

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:creatorstore}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_mailtrap_user}
    password: ${MAIL_PASSWORD:your_mailtrap_pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# NEW: API Versioning Configuration
api:
  version:
    current: v1
    deprecated: [] # Add old versions here when they become deprecated (e.g., [v0])

# Meilisearch Configuration
meilisearch:
  url: ${MEILISEARCH_URL:http://localhost:7700}
  key: ${MEILISEARCH_KEY:your_master_key_here}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456}
  expiration: ${JWT_EXPIRATION:86400000}

# Admin user initialization
admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@creatorstore.com}
  password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8080

logging:
  level:
    root: INFO
    in.anurag.CreatorStore: INFO
