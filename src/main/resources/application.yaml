spring:
  application:
    name: CreatorStore

  # PostgreSQL configuration (used in Docker)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/creatorstore}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false # Disable in production
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456}
  expiration: ${JWT_EXPIRATION:86400000}

# Admin user initialization
admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@creatorstore.com}
  password: ${ADMIN_PASSWORD:admin123}

# Server configuration
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    in.anurag.CreatorStore: INFO
