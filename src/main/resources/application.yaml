spring:
  application:
    name: CreatorStore
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:creatorstore}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_mailtrap_user}
    password: ${MAIL_PASSWORD:your_mailtrap_pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

api:
  version:
    current: v1
    deprecated: []

meilisearch:
  url: ${MEILISEARCH_URL:http://localhost:7700}
  key: ${MEILISEARCH_KEY:your_master_key_here}

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@creatorstore.com}
  password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8080

logging:
  level:
    root: INFO
    in.anurag.CreatorStore: INFO

# ✅ NEW: Observability & Monitoring Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # 100% of requests traced (for dev)
  zipkin:
    tracing:
      # Uses env var for Docker, falls back to localhost for local dev
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
