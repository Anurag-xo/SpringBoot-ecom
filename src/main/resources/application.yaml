spring:
  application:
    name: CreatorStore

  # Defaults to H2 for local dev/testing, but can be overridden by Docker/Environment variables
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:creatorstore}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # REMOVED: dialect property. Spring Boot will auto-detect H2 or PostgreSQL automatically!

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456}
  expiration: ${JWT_EXPIRATION:86400000}

# Admin user initialization
admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@creatorstore.com}
  password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8080

logging:
  level:
    root: INFO
    in.anurag.CreatorStore: INFO

mail:
  host: ${MAIL_HOST:smtp.mailtrap.io} # e.g., smtp.mailtrap.io or smtp.gmail.com
  port: ${MAIL_PORT:587} # 587 for TLS
  username: ${MAIL_USERNAME:your_mailtrap_user}
  password: ${MAIL_PASSWORD:your_mailtrap_pass}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
