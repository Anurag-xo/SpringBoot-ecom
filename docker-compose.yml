version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorstore-db
    environment:
      POSTGRES_DB: creatorstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - creatorstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: creatorstore-search
    environment:
      MEILI_MASTER_KEY: your_master_key_here
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - creatorstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://localhost:7700/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ✅ NEW: Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: creatorstore-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - creatorstore-network
    restart: unless-stopped

  # ✅ NEW: Grafana (Metrics Visualization)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: creatorstore-grafana
    ports:
      - "3001:3000" # Mapped to 3001 to avoid conflict with React frontend on 3000
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    networks:
      - creatorstore-network
    restart: unless-stopped

  # ✅ NEW: Zipkin (Distributed Tracing)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: creatorstore-zipkin
    ports:
      - "9411:9411"
    networks:
      - creatorstore-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creatorstore-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/creatorstore
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: your_master_key_here
      JWT_SECRET: YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456
      JWT_EXPIRATION: 86400000
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@creatorstore.com
      ADMIN_PASSWORD: admin123
      # ✅ NEW: Tell the app where Zipkin is in the Docker network
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - creatorstore-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  meilisearch_data:
    driver: local
  app_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  creatorstore-network:
    driver: bridge
