version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: creatorstore-db
    environment:
      POSTGRES_DB: creatorstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - creatorstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creatorstore-app
    ports:
      - "8080:8080"
    environment:
      # Database connection (points to the postgres service)
      DATABASE_URL: jdbc:postgresql://postgres:5432/creatorstore
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      # JWT secret (CHANGE THIS IN PRODUCTION!)
      JWT_SECRET: YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456
      JWT_EXPIRATION: 86400000
      # Admin user
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@creatorstore.com
      ADMIN_PASSWORD: admin123
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - creatorstore-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local

networks:
  creatorstore-network:
    driver: bridge
