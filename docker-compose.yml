version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorstore-db
    environment:
      POSTGRES_DB: creatorstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - creatorstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NEW: Meilisearch Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: creatorstore-search
    environment:
      MEILI_MASTER_KEY: your_master_key_here
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - creatorstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://localhost:7700/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creatorstore-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/creatorstore
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      # NEW: Meilisearch connection
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: your_master_key_here
      JWT_SECRET: YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456
      JWT_EXPIRATION: 86400000
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@creatorstore.com
      ADMIN_PASSWORD: admin123
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - creatorstore-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  meilisearch_data:
    driver: local
  app_uploads:
    driver: local

networks:
  creatorstore-network:
    driver: bridge
